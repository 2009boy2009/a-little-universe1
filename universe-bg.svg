</g>
<g stroke="#ffe5fb" stroke-width="2" filter="url(#glow)" opacity=".9">
<path d="M180 150v18m-9-9h18"/><path d="M410 118v22m-11-11h22"/><path d="M1040 50v20m-10-10h20"/><path d="M1460 290v20m-10-10h20"/>
</g>
<!-- Crescent -->
<circle cx="1260" cy="180" r="72" fill="url(#moon)" filter="url(#glow)"/>
<circle cx="1297" cy="145" r="72" fill="#11112c"/>
