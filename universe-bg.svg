<path d="M1180 650 Q1240 550 1310 610 Q1370 520 1430 585 Q1510 520 1600 610 L1600 760 L1160 760Z"/>
</g>
<!-- Horizon glow -->
<ellipse cx="800" cy="755" rx="760" ry="105" fill="#ff9acb" opacity=".45" filter="url(#blur)"/>
<!-- Mountains -->
<path d="M0 735 L180 640 290 700 470 610 610 705 770 650 920 715 1090 620 1230 700 1390 575 1600 690 1600 830 0 830Z" fill="#56375e"/>
<path d="M0 780 L170 700 310 750 475 680 620 765 790 710 950 780 1110 700 1270 755 1435 625 1600 730 1600 870 0 870Z" fill="#30243f"/>
