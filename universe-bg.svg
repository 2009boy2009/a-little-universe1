<g transform="translate(80 870)"><path d="M0 130Q-10 50 0 0" stroke="#263b39" fill="none" stroke-width="7"/><circle cx="0" cy="0" r="12"/><circle cx="-15" cy="-4" r="10"/><circle cx="15" cy="-4" r="10"/><circle cx="0" cy="-16" r="10"/><circle cx="0" cy="14" r="10"/></g>
<g transform="translate(180 920) scale(1.3)"><path d="M0 100Q-12 45 0 0" stroke="#263b39" fill="none" stroke-width="6"/><circle r="11"/><circle cx="-14" cy="-4" r="9"/><circle cx="14" cy="-4" r="9"/><circle cy="-15" r="9"/><circle cy="13" r="9"/></g>
<g transform="translate(1460 900) scale(1.2)"><path d="M0 120Q10 55 0 0" stroke="#263b39" fill="none" stroke-width="6"/><circle r="11"/><circle cx="-14" cy="-4" r="9"/><circle cx="14" cy="-4" r="9"/><circle cy="-15" r="9"/><circle cy="13" r="9"/></g>
</g>
</svg>