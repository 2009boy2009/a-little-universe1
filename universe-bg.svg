<path d="M0 470 Q45 390 110 430 Q130 350 205 385 Q255 320 310 390 Q370 385 390 465 Q455 480 475 550 L0 620Z"/>
<path d="M1120 490 Q1160 400 1225 440 Q1260 350 1330 390 Q1400 320 1455 405 Q1540 385 1600 470 L1600 630 L1100 620Z"/>
