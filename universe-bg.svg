<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#090b25"/><stop offset=".48" stop-color="#34204f"/><stop offset=".76" stop-color="#9a477d"/><stop offset="1" stop-color="#241a3d"/></linearGradient>
 <radialGradient id="neb"><stop stop-color="#f05ab7" stop-opacity=".7"/><stop offset=".45" stop-color="#a63f9c" stop-opacity=".34"/><stop offset="1" stop-color="#49225f" stop-opacity="0"/></radialGradient>
 <linearGradient id="cloud" x2=".2" y2="1"><stop stop-color="#f9a2d5"/><stop offset=".38" stop-color="#a957a4"/><stop offset="1" stop-color="#39264f"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#d96da9"/><stop offset=".3" stop-color="#68416f"/><stop offset="1" stop-color="#17172f"/></linearGradient>
 <linearGradient id="moon" x2=".8" y2="1"><stop stop-color="#fff4f0"/><stop offset=".5" stop-color="#ffc4b8"/><stop offset="1" stop-color="#e889b0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<ellipse cx="350" cy="260" rx="470" ry="300" fill="url(#neb)" filter="url(#blur)"/>
<ellipse cx="1330" cy="300" rx="450" ry="300" fill="url(#neb)" filter="url(#blur)"/>
<ellipse cx="800" cy="610" rx="650" ry="190" fill="#e65cae" opacity=".26" filter="url(#blur)"/>
